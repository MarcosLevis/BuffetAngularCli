
<div mat-dialog-content>
    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
      
      <h1 class="title-form">Registro</h1>
      
      <label>Imagen elegida:</label>
      <div class="images">
        <div class="file-input-container">
          <input class="hide" type="file" id="foto" accept="image/*" (change)="seleccionarImagen($event)"/>
          <label for="foto" class="file-label">
            <img [src]="imagenBase64" alt="Subir foto"/>
          </label>
        </div>
        <button type="button" (click)="seleccionarImagenLocal('assets/perro.jpg')"><img src="assets/perro.jpg"></button>
        <button type="button" (click)="seleccionarImagenLocal('assets/gato.jpg')"><img src="assets/gato.jpg"></button> 
      </div>

      <!-- DNI -->
      <div class="form-group">
        <label class="form-label" for="dni">DNI</label>
        <input type="text" id="dni" placeholder="Ingrese su DNI" formControlName="dni" required />
      </div>  

      <!-- Nombre -->
      <div class="form-group">
        <label class="form-label" for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre" formControlName="nombre" required/>
      </div>
  
      <!-- Apellidos -->
      <div class="form-group">
        <label class="form-label" for="apellido">Apellidos</label>
        <input type="text" id="apellido" placeholder="Ingrese sus apellidos" formControlName="apellido" required/>
      </div>
  
      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="Ingrese su correo" formControlName="email" required />
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña" formControlName="password" required />
      </div>
        
      <button type="submit" class="btn btn-dark">{{(rol == 'cliente') ? 'Registrarse' : 'Registrar'}}</button>
 
    </form>

</div>

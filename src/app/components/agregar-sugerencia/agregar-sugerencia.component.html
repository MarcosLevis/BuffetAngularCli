<div mat-dialog-content>
    <form [formGroup]="sugerenciaForm" (ngSubmit)="onSubmit()">
    
      <h1 class="title-form">¡Comparte tu sugerencia!</h1>
      <div class="form-group">
        <label class="form-label" for="tipo">Categoría de sugerencia:</label>
        <mat-select class="mat-select" id="tipo" formControlName="tipo">
          <mat-option *ngFor="let categoria of categorias" [value]="categoria">
            {{ categoria }}
          </mat-option>
        </mat-select>
      </div>
      
      <textarea class="form-control" rows="4" maxlength="256" placeholder="Escribe tu sugerencia aquí..." formControlName="texto" required></textarea>

      <button type="submit" class="btn btn-dark">Sugerir</button>
 
    </form>
</div>

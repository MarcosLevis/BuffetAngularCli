<h1 class="titulo">Productos</h1>
<div class="ambas-tablas">
  <div class="table-container">
    <div class="table-responsive">
      <table class="table table-bordered" *ngIf="productos.length > 0">
        <thead class="table-dark">
          <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th *ngIf="authService.isAdministrador()">Editar/Borrar</th>
            <th *ngIf="authService.isCliente()">Agregar al pedido</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let producto of productos; trackBy: trackById">
            <tr>
              <td>
                <p>{{ getSlice(producto.nombre,0,50) + ((producto.nombre.length > 50) ? '...' : '')}}</p>
              </td>
              <td>$ {{ producto.precio }}</td>
              <td class="separadas" *ngIf="!authService.isResponsableTurno()">
                <button class="btn btn-dark" (click)="openDialogAgregarProducto(producto)" *ngIf="authService.isAdministrador()">
                  <i class="bi bi-pencil-fill" ></i><!--editar-->
                </button>
                <button class="btn btn-dark" (click)="eliminarProducto(producto)" *ngIf="authService.isAdministrador()">
                  <i class="bi bi-trash-fill"></i><!--borrar-->
                </button>
                <button class="btn btn-dark" (click)="agregarAlPedido(producto)" *ngIf="authService.isCliente()">
                  <i class="bi bi-plus"></i><!--agrear al pedido-->
                </button>
                <button class="btn btn-dark" (click)="sacarDelPedido(producto)" *ngIf="authService.isCliente()">
                  <i class="bi bi-dash"></i><!--agrear al pedido-->
                </button>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
      <div *ngIf="productos.length == 0">
        <p>¡No hay productos aún!</p>
      </div>
    </div>
  </div>

  <div class="columna-pedido d-flex flex-column">
    <div class="alfondo">
      <button *ngIf="authService.isAdministrador()" class="btn btn-dark" (click)="openDialogAgregarProducto()">Agregar</button>
    </div>
    <div class="flex-grow-1 overflow-auto">
      <app-pedido *ngIf="authService.isCliente()" (agregarExitoso)="onProductoAgregado($event)"></app-pedido>
    </div>
  </div>  
</div>

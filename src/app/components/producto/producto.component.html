<h1 class="titulo">Productos</h1>
<div class="table-container">
  <div class="table-responsive">
    <table class="table table-bordered" *ngIf="productos.length > 0">
      <thead class="table-dark">
        <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Editar/Borrar</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let producto of productos; trackBy: trackById">
          <tr>
            <td>{{ producto.nombre }}</td>
            <td>$ {{ producto.precio }}</td>
            <td class="separadas">
              <button class="btn btn-dark">
                <i class="bi bi-pencil-fill"></i>
              </button>
              <button class="btn btn-dark">
                <i class="bi bi-trash-fill"></i>
              </button>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
    <div *ngIf="productos.length == 0">
      <p>¡No hay productos aún!</p>
    </div>
  </div>
</div>
<div class="agregar-container" style="display: flex; align-items: flex-end">
    <button class="btn btn-dark" (click)="openDialogAgregarProducto()">Agregar</button>
</div>


<div mat-dialog-content>
    <form [formGroup]="productoForm" (ngSubmit)="onSubmit()">
      
      <h1 class="title-form">Productos</h1>

      <div class="form-group">
        <label class="form-label" for="nombre">Nombre</label>
        <input type="text" maxlength="50" id="nombre" placeholder="Ingrese el nombre" formControlName="nombre" required/>
      </div>
  
      <div class="form-group">
        <label class="form-label" for="precio">Precio</label>
        <input type="number" min="0" max="99999999.9" step="0.1" id="precio" placeholder="Ingrese el precio" formControlName="precio" required/>
      </div>
        
      <button type="submit" class="btn btn-dark">Confirmar</button>
 
    </form>

</div>

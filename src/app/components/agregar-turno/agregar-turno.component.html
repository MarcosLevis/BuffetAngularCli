<div mat-dialog-content>
    <form [formGroup]="turnoForm" (ngSubmit)="onSubmit()">
      
      <h1 class="title-form">{{!!turnoEditar ? 'Editar' : 'Agregar'}} Turno</h1>

      <!-- Nombre -->
      <div class="form-group">
        <label class="form-label" for="nombre">Turno</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre" formControlName="nombre" required/>
      </div>
  
      <!-- Entrada -->
      <div class="form-group">
        <label class="form-label" for="entrada">Hora de entrada</label>
        <input type="time" id="entrada" placeholder="Ingrese la hora de entrada" formControlName="entrada" required/>
      </div>

      <!-- Salida -->
      <div class="form-group">
        <label class="form-label" for="salida">Hora de salida</label>
        <input type="time" id="salida" placeholder="Ingrese la hora de salida" formControlName="salida" required/>
      </div>
        
      <button type="submit" class="btn btn-dark">{{!!turnoEditar ? 'Editar' : 'Agregar'}}</button>
 
    </form>

</div>
